<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <title>Учебная гонка</title>
  <style>
    :root {
      color-scheme: dark;
      --panel: rgba(9, 19, 35, .93);
      --panel-soft: rgba(14, 28, 47, .88);
      --hud-bg: rgba(6, 15, 28, .84);
      --overlay-bg: rgba(3, 8, 15, .60);
      --selected-bg: rgba(255, 213, 74, .16);
      --app-top: #10243f;
      --app-bottom: #050b14;
      --button-top: #ffe46d;
      --button-bottom: #ffbf32;
      --button-text: #332000;
      --accent-shadow: rgba(255,188,45,.30);
      --line: rgba(255,255,255,.15);
      --accent: #ffd54a;
      --accent-2: #46d6ff;
      --success: #5ce18a;
      --danger: #ff5d6c;
      --text: #f6f8ff;
      --muted: #b7c1d8;
      --quiz-neon: #46d6ff;
      --question-plate: #101b31;
      --quiz-panel-bg: rgba(6, 10, 18, .97);
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #07101e;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    button, input, textarea, select { font: inherit; }
    button { -webkit-tap-highlight-color: transparent; }

    #app {
      width: 100vw;
      height: 100vh;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 50% 15%, color-mix(in srgb, var(--accent-2) 28%, transparent), transparent 36%),
        linear-gradient(180deg, var(--app-top), var(--app-bottom));
    }

    #stage {
      position: relative;
      overflow: hidden;
      width: min(100vw, calc(100vh * 16 / 9));
      height: min(100vh, calc(100vw * 9 / 16));
      background: #222c38;
      box-shadow: 0 20px 80px rgba(0,0,0,.55);
      isolation: isolate;
      touch-action: none;
    }

    @media (orientation: portrait) {
      #stage { width: 100vw; height: 100vh; }
    }

    canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    .hud {
      position: absolute;
      z-index: 15;
      top: max(10px, env(safe-area-inset-top));
      left: 10px;
      right: 10px;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
      pointer-events: none;
    }

    .hud-group {
      display: flex;
      gap: 7px;
      flex-wrap: wrap;
      align-items: flex-start;
    }

    .pill {
      min-width: 82px;
      padding: 7px 10px;
      border: 1px solid var(--line);
      border-radius: 13px;
      background: var(--hud-bg);
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 24px rgba(0,0,0,.22);
    }

    .pill small {
      display: block;
      color: var(--muted);
      font-size: 10px;
      line-height: 1.1;
    }

    .pill strong {
      display: block;
      color: white;
      font-size: 16px;
      margin-top: 2px;
      white-space: nowrap;
    }

    .lives-pill { min-width: 144px; }
    #livesValue {
      color: #ff6680;
      letter-spacing: 1px;
      font-size: 20px;
      line-height: 1;
    }

    .icon-btn {
      pointer-events: auto;
      width: 42px;
      height: 42px;
      border: 1px solid var(--line);
      border-radius: 13px;
      color: white;
      background: var(--hud-bg);
      cursor: pointer;
      font-size: 20px;
    }

    .icon-btn:hover { background: rgba(20, 42, 70, .95); }

    .overlay {
      position: absolute;
      z-index: 30;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 18px;
      background: var(--overlay-bg);
      backdrop-filter: blur(8px);
    }

    .overlay.hidden { display: none; }

    .panel {
      width: min(760px, 100%);
      max-height: calc(100vh - 36px);
      overflow: auto;
      padding: clamp(18px, 3vw, 30px);
      border: 1px solid rgba(255,255,255,.16);
      border-radius: 24px;
      background: var(--panel);
      color: var(--text);
      box-shadow: 0 30px 100px rgba(0,0,0,.5);
    }

    .panel h1, .panel h2 { margin: 0 0 10px; }
    .panel p { color: var(--muted); line-height: 1.5; }
    .menu-grid { display: grid; gap: 22px; }
    .section-title { margin: 0 0 10px; font-size: 15px; color: #dfe7f8; }

    .car-grid {
      display: grid;
      grid-template-columns: repeat(6, minmax(80px, 1fr));
      gap: 10px;
    }

    @media (max-width: 740px) {
      .car-grid { grid-template-columns: repeat(3, 1fr); }
      .pill { min-width: 72px; padding: 6px 8px; }
      .pill strong { font-size: 14px; }
      .lives-pill { min-width: 125px; }
    }

    .car-card {
      position: relative;
      border: 2px solid transparent;
      border-radius: 16px;
      background: rgba(255,255,255,.06);
      min-height: 126px;
      padding: 8px;
      color: white;
      cursor: pointer;
      transition: transform .15s ease, border-color .15s ease, background .15s ease;
    }

    .car-card.selected {
      border-color: var(--accent);
      background: var(--selected-bg);
    }

    .car-card:hover {
      transform: translateY(-2px);
      background: rgba(255,255,255,.1);
    }

    .car-card img {
      width: 100%;
      height: 86px;
      object-fit: contain;
      display: block;
    }

    .car-card span {
      display: block;
      font-size: 12px;
      text-align: center;
      color: #dce5f7;
    }

    .difficulty-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .difficulty-btn {
      padding: 14px 10px;
      border: 2px solid transparent;
      border-radius: 14px;
      background: rgba(255,255,255,.06);
      color: white;
      cursor: pointer;
    }

    .difficulty-btn.selected {
      border-color: var(--accent-2);
      background: color-mix(in srgb, var(--accent-2) 18%, transparent);
    }

    .difficulty-btn small {
      display: block;
      margin-top: 4px;
      color: var(--muted);
    }

    .primary-btn, .secondary-btn, .answer-btn {
      border: 0;
      border-radius: 14px;
      cursor: pointer;
      font-weight: 800;
    }

    .primary-btn {
      padding: 15px 22px;
      background: linear-gradient(180deg, var(--button-top), var(--button-bottom));
      color: var(--button-text);
      box-shadow: 0 10px 30px var(--accent-shadow);
    }

    .primary-btn:hover { filter: brightness(1.05); }

    .secondary-btn {
      padding: 13px 18px;
      background: var(--panel-soft);
      color: white;
      border: 1px solid var(--line);
    }

    .menu-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    #countdown {
      position: absolute;
      z-index: 22;
      inset: 0;
      display: none;
      place-items: center;
      pointer-events: none;
      font-size: clamp(80px, 20vw, 220px);
      font-weight: 1000;
      color: white;
      text-shadow: 0 8px 40px rgba(0,0,0,.55), 0 0 20px rgba(255,214,74,.35);
    }

    #countdown.show { display: grid; }

    #toast {
      position: absolute;
      z-index: 45;
      left: 50%;
      top: 92px;
      transform: translate(-50%, -12px);
      padding: 9px 16px;
      border-radius: 999px;
      background: var(--panel-soft);
      border: 1px solid rgba(255,255,255,.18);
      color: white;
      font-weight: 900;
      opacity: 0;
      pointer-events: none;
      transition: .2s ease;
      white-space: nowrap;
    }

    #toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    #quizOverlay {
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 50%, color-mix(in srgb, var(--quiz-neon) 12%, transparent), transparent 28%),
